name: berea_interlineal
description: "Berea Interlineal - Estudio bíblico interlineal Hebreo-Griego-Español (Hechos 17:11)"
publish_to: 'none'
version: 1.3.2+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/logos_k_logos.db
    - assets/data/sample.json
    - assets/images/berea_interlineal_icon.jpg

  fonts:
    - family: EzraSIL
      fonts:
        - asset: assets/fonts/EzraSIL-Regular.ttf
    - family: FrankRuhlLibre
      fonts:
        - asset: assets/fonts/FrankRuhlLibre-Regular.ttf
    - family: Cardo
      fonts:
        - asset: assets/fonts/Cardo-Regular.ttf
        - asset: assets/fonts/Cardo-Bold.ttf
          weight: 700
    - family: GentiumPlus
      fonts:
        - asset: assets/fonts/GentiumPlus-Regular.ttf
        - asset: assets/fonts/GentiumPlus-Bold.ttf
          weight: 700
