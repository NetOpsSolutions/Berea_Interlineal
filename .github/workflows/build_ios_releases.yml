name: Build iOS Release (IPA)

on:
  # 1. Ejecución retroactiva manual para compilar cualquier release existente (ej. 1.3.1, 1.3.0, 1.3.2)
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release a compilar y empaquetar (ej: 1.3.1, 1.3.0, 1.3.2)'
        required: true
        default: '1.3.1'
        type: string
      upload_to_release:
        description: 'Adjuntar automáticamente el archivo .ipa a la GitHub Release'
        required: true
        default: true
        type: boolean

  # 2. Ejecución automática cada vez que se cree un tag de versión
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

# Permisos requeridos para que GITHUB_TOKEN pueda adjuntar assets a las Releases
permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS IPA
    # macos-14 utiliza runners Apple Silicon (M2) de alto rendimiento
    runs-on: macos-14

    steps:
      - name: 🏷️ Resolver Tag y Nombre del Paquete
        id: vars
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed 's/^v//')
          IPA_NAME="Logos_K_Logos_${CLEAN_TAG}.ipa"

          echo "raw_tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "clean_tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "ipa_name=$IPA_NAME" >> $GITHUB_OUTPUT

          echo "=================================================="
          echo " Compilando Logos K Logos para iOS (iPhone / iPad)"
          echo " Tag objetivo : $RAW_TAG"
          echo " Versión limpia: $CLEAN_TAG"
          echo " Nombre de IPA : $IPA_NAME"
          echo "=================================================="

      - name: 📥 Checkout del Código Fuente (Ref: ${{ steps.vars.outputs.raw_tag }})
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.raw_tag }}
          fetch-depth: 0

      - name: 📱 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🔍 Diagnóstico del Entorno (Flutter, Xcode y CocoaPods)
        run: |
          echo "--- Versión de Flutter ---"
          flutter --version
          echo "--- Estado de Flutter Doctor ---"
          flutter doctor -v
          echo "--- Versión de Xcode ---"
          xcodebuild -version
          echo "--- Versión de CocoaPods ---"
          pod --version

      - name: 📦 Instalar Dependencias de Flutter
        run: |
          flutter pub get

      - name: 🍎 Configurar Dependencias Nativas (CocoaPods)
        run: |
          cd ios
          if [ ! -f "Podfile" ]; then
            echo "Generando Podfile para iOS..."
            cd ..
            flutter build ios --config-only
            cd ios
          fi
          echo "Ejecutando pod install..."
          pod install --repo-update
          cd ..

      - name: 🔨 Compilar Runner de iOS (Release ARM64)
        run: |
          echo "Iniciando compilación nativa con Xcode..."
          flutter build ios --release --no-codesign

      - name: 📦 Empaquetar Payload a Formato .IPA Universal
        run: |
          IPA_NAME="${{ steps.vars.outputs.ipa_name }}"
          BUILD_DIR="build/ios/iphoneos"
          
          echo "Generando estructura estándar de IPA..."
          mkdir -p "${BUILD_DIR}/Payload"
          cp -r "${BUILD_DIR}/Runner.app" "${BUILD_DIR}/Payload/"
          
          cd "${BUILD_DIR}"
          echo "Comprimiendo Payload a ${IPA_NAME}..."
          zip -r -9 "${IPA_NAME}" Payload
          
          echo "Generando suma de verificación SHA-256..."
          shasum -a 256 "${IPA_NAME}" > "${IPA_NAME}.sha256"
          
          echo "--- Archivos generados ---"
          ls -lh "${IPA_NAME}"*
          cat "${IPA_NAME}.sha256"

      - name: ☁️ Subir IPA como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.ipa_name }}
          path: |
            build/ios/iphoneos/${{ steps.vars.outputs.ipa_name }}
            build/ios/iphoneos/${{ steps.vars.outputs.ipa_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Adjuntar IPA a la GitHub Release (${{ steps.vars.outputs.raw_tag }})
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_release == 'true' || github.event.inputs.upload_to_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.raw_tag }}
          files: |
            build/ios/iphoneos/Logos_K_Logos_*.ipa
            build/ios/iphoneos/Logos_K_Logos_*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
